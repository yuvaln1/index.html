```html
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blackjack Club — Multiplayer</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at top,#16452f,#07130e 60%);
  color:#fff;
  min-height:100vh
}

.wrap{
  max-width:1150px;
  margin:auto;
  padding:24px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px
}

h1{margin:0;font-size:30px}
.sub{color:#b9d7c5}

.card{
  background:rgba(8,20,14,.88);
  border:1px solid #315a43;
  border-radius:20px;
  padding:20px;
  box-shadow:0 15px 50px #0006;
  margin-bottom:16px
}

.grid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:16px
}

@media(max-width:800px){
  .grid{
    grid-template-columns:1fr
  }

  .top{
    align-items:flex-start;
    flex-direction:column
  }
}

label{
  display:block;
  margin:10px 0 6px;
  color:#cfe7d7
}

input{
  width:100%;
  padding:13px;
  border-radius:11px;
  border:1px solid #466b54;
  background:#10251a;
  color:#fff;
  font-size:16px
}

button{
  border:0;
  border-radius:12px;
  padding:12px 17px;
  font-weight:700;
  cursor:pointer;
  background:#e7bd55;
  color:#171208;
  margin:4px
}

button:hover{
  filter:brightness(1.08)
}

button.secondary{
  background:#234e38;
  color:#fff
}

button:disabled{
  opacity:.45;
  cursor:not-allowed
}

.row{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  align-items:center
}

.hidden{
  display:none!important
}

.room{
  font-size:25px;
  letter-spacing:4px;
  background:#0a1b12;
  border:1px dashed #6e9b7e;
  border-radius:12px;
  padding:10px 14px;
  display:inline-block
}

.status{
  padding:9px 12px;
  border-radius:10px;
  background:#183b29;
  color:#c9efd5;
  margin-top:10px
}

.players{
  display:grid;
  gap:8px
}

.player{
  display:flex;
  justify-content:space-between;
  padding:11px;
  border-radius:10px;
  background:#10251a;
  border:1px solid #284b37
}

.table{
  min-height:390px;
  border-radius:28px;
  padding:25px;
  background:radial-gradient(ellipse,#197044,#0a432a 60%,#06301e);
  border:8px solid #553a22;
  box-shadow:inset 0 0 60px #0008,0 20px 60px #0007
}

.hand{
  display:flex;
  justify-content:center;
  gap:8px;
  min-height:92px;
  flex-wrap:wrap
}

.playing-card{
  width:58px;
  height:82px;
  border-radius:8px;
  background:#fff;
  color:#111;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:6px;
  font-weight:800;
  box-shadow:0 5px 10px #0005
}

.red{
  color:#c62828
}

.back{
  background:repeating-linear-gradient(
    45deg,
    #1f4f9b,
    #1f4f9b 5px,
    #fff 5px,
    #fff 7px
  );
  color:transparent
}

.center{text-align:center}

.total{
  font-size:18px;
  margin:7px
}

.actions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:12px
}

.small{
  font-size:13px;
  color:#9eb9a8
}

.log{
  height:150px;
  overflow:auto;
  background:#07150d;
  border-radius:10px;
  padding:10px;
  font-size:13px
}

hr{
  border:0;
  border-top:1px solid #315a43;
  margin:16px 0
}

.ready{
  color:#9ff0b4;
  font-weight:700
}

.chips{
  color:#ffd95c;
  font-weight:700
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">

    <div>
      <h1>♠ Blackjack Club</h1>

      <div class="sub">
        משחק קל
```
